<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Histórico de Compras</title>

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

        <style>
            :root {
                --cor-fundo: #09131a;
                --cor-destaque: #65161E;
            }

            body {
                background-color: var(--cor-fundo);
            }

            .navbar-destaque {
                background-color: var(--cor-destaque);
            }

            .card h2 {
                color: var(--cor-destaque);
            }

            .table thead th {
                background-color: var(--cor-destaque);
                color: #fff;
            }

            .btn-outline-primary {
                --bs-btn-color: #65161E;
                --bs-btn-border-color: #65161E;
                --bs-btn-hover-color: #fff;
                --bs-btn-hover-bg: #65161E;
                --bs-btn-hover-border-color: #65161E;
                --bs-btn-active-color: #fff;
                --bs-btn-active-bg: #65161E;
                --bs-btn-active-border-color: #65161E;
            }
        </style>
    </head>
    <body>

        <nav class="navbar navbar-dark navbar-destaque mb-4">
            <div class="container">
                <span class="navbar-brand mb-0 h1">Cinemix</span>
            </div>
        </nav>

        <main class="container">

            <h1 class="h3 mb-4 text-white">Histórico de Compras</h1>

            <div class="card shadow-sm mb-4">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead>
                            <tr>
                                <th>Pedido</th>
                                <th>Data</th>
                                <th>Filme</th>
                                <th>Valor</th>
                                <th>Pagamento</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:if="${#lists.isEmpty(compras)}">
                                <td colspan="5" class="text-center">
                                    Nenhuma compra encontrada.
                                </td>
                            </tr>

                            <tr th:each="compra : ${compras}">
                                <td th:text="|#${compra.id}|"></td>

                                <td th:text="${#temporals.format(compra.dataCompra, 'dd/MM/yyyy')}">
                                </td>

                                <td th:text="${compra.filmes.titulo}"></td>

                                <td th:text="|R$ ${#numbers.formatDecimal(compra.valor, 1, 2)}|">
                                </td>

                                <td th:text="${compra.tipoPagamento.nome}"></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <h2 class="h4 mb-3 text-white">Histórico de Aluguéis</h2>

            <div class="card shadow-sm mb-4">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead>
                            <tr>
                                <th>Pedido</th>
                                <th>Data</th>
                                <th>Devolução</th>
                                <th>Filme</th>
                                <th>Valor</th>
                                <th>Pagamento</th>
                            </tr>
                        </thead>

                        <tbody>
                            <tr th:if="${#lists.isEmpty(alugueis)}">
                                <td colspan="5" class="text-center">
                                    Nenhum aluguel encontrado.
                                </td>
                            </tr>

                            <tr th:each="aluguel : ${alugueis}">
                                <td th:text="|#${aluguel.id}|"></td>

                                <td th:text="${#temporals.format(aluguel.dataInicio, 'dd/MM/yyyy')}"></td>
                                
                                <td th:text="${#temporals.format(aluguel.dataDevolucao, 'dd/MM/yyyy')}"></td>

                                <td th:text="${aluguel.filmes.titulo}"></td>

                                <td th:text="|R$ ${#numbers.formatDecimal(aluguel.valor, 1, 2)}|"></td>

                                <td th:text="${aluguel.tipoPagamento.nome}"></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </main>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    </body>
</html>
