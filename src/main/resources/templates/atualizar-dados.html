<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Alterar Dados</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

        <style>
            :root {
                --cor-fundo: #09131a;
                --cor-destaque: #65161E;
            }

            body {
                background-color: var(--cor-fundo);
            }

            .navbar-destaque {
                background-color: var(--cor-destaque);
            }

            .card h2 {
                color: var(--cor-destaque);
            }

            .btn-destaque {
                background-color: var(--cor-destaque);
                border-color: var(--cor-destaque);
                color: #fff;
            }

            .btn-destaque:hover {
                background-color: #4d1117;
                border-color: #4d1117;
                color: #fff;
            }

            .form-control:focus {
                border-color: var(--cor-destaque);
                box-shadow: 0 0 0 0.25rem rgba(101, 22, 30, 0.25);
            }
        </style>
    </head>
    <body>

        <nav class="navbar navbar-dark navbar-destaque mb-4">
            <div class="container">
                <span class="navbar-brand mb-0 h1">Cinemix</span>
            </div>
        </nav>

        <main class="container">

            <div class="row justify-content-center">
                <div class="col-12 col-md-8 col-lg-6">

                    <h1 class="h3 mb-4 text-white">Alterar dados</h1>

                    <div class="card shadow-sm mb-4">
                        <div class="card-body p-4">

                            <form class="d-flex flex-column gap-3"
                                  th:action="@{/atualizar-dados}"
                                  th:object="${usuario}"
                                  method="post"
                                  id="formularioAtualizar">

                                <h2 class="h5 mb-3">Dados pessoais</h2>

                                <div class="mb-3">
                                    <label for="nome" class="form-label">Nome completo</label>
                                    <input type="text" th:field="*{nome}"
                                           class="form-control" id="nome" required>
                                </div>

                                <div class="mb-3">
                                    <label for="email" class="form-label">E-mail</label>
                                    <input type="email" th:field="*{email}"
                                           class="form-control" id="email" required>
                                </div>

                                <div class="mb-3">
                                    <label for="telefone" class="form-label">Telefone</label>
                                    <input type="tel" th:field="*{telefone}"
                                           class="form-control" id="telefone"
                                           placeholder="(11) 99999-9999">
                                </div>

                                <div class="mb-3">
                                    <label for="cidade" class="form-label">Cidade</label>
                                    <input type="text" th:field="*{cidade}"
                                           class="form-control" id="cidade" required>
                                </div>

                                <hr>

                                <h2 class="h5 mb-3">Alterar senha</h2>

                                <div class="mb-3">
                                    <label for="novaSenha" class="form-label">Nova senha</label>
                                    <input type="password" class="form-control"
                                           id="novaSenha" name="novaSenha"
                                           minlength="6" maxlength="12"
                                           autocomplete="new-password">
                                </div>

                                <div class="mb-3">
                                    <label for="confirmarSenha" class="form-label">
                                        Confirmar nova senha
                                    </label>
                                    <input type="password" class="form-control"
                                           id="confirmarSenha" name="confirmarSenha"
                                           minlength="6" maxlength="12"
                                           autocomplete="new-password">
                                    <div class="text-danger small d-none"
                                         id="erroSenha">
                                        As senhas não conferem.
                                    </div>
                                </div>

                                <div th:if="${mensagem}"
                                     class="alert alert-success"
                                     th:text="${mensagem}">
                                </div>

                                <div class="d-flex gap-2 justify-content-end">
                                    <a th:href="@{/home}"
                                       class="btn btn-outline-secondary">Cancelar</a>

                                    <button type="submit"
                                            class="btn btn-destaque">
                                        Salvar alterações
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>

                </div>
            </div>
        </main>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

        <script>
            document.getElementById('formularioAtualizar')
                    .addEventListener('submit', function (event) {
                        const senha = document.getElementById('novaSenha').value;
                        const confirmar = document.getElementById('confirmarSenha').value;
                        const erro = document.getElementById('erroSenha');

                        if (senha !== confirmar) {
                            event.preventDefault();
                            erro.classList.remove('d-none');
                            return;
                        }

                        erro.classList.add('d-none');
                    });
        </script>

    </body>
</html>
