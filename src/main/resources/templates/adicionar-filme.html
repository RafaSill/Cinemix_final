<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
              integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link
            href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Bebas+Neue&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Limelight&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Noticia+Text:ital,wght@0,400;0,700;1,400;1,700&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
            rel="stylesheet">

        <link rel="stylesheet" th:href="@{/CSS/reset.css}">
        <link rel="stylesheet" th:href="@{/CSS/home.css}">
        <link rel="stylesheet" th:href="@{/CSS/adicionar-filme.css}">

        <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

        <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery-validate/1.22.1/jquery.validate.min.js"></script>

        <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery-validate/1.22.1/localization/messages_pt_BR.min.js"></script>

        <title>Adicionar filmes</title>
    </head>

    <body>

        <header>
            <h1>CINEMIX</h1>
        </header>

        <form class="adicionar-filmes d-flex flex-column gap-3" action="*" th:action="@{/adicionar-filme}" th:object="${filme}" method="POST">

            <div>
                <label for="titulo" class="form-label">Título</label>
                <input type="text" th:field="*{titulo}" class="form-control" id="titulo" name="titulo">

                <span class="erro-titulo"
                      style="display:flex; font-size:15px; margin-bottom: 10px;"></span>

            </div>

            <div>
                <label for="genero" class="form-label">Gênero</label>
                <input type="text" th:field="*{genero}" class="form-control" id="genero" name="genero">

                <span class="erro-genero"
                      style="display:flex; font-size:15px; margin-bottom: 10px;"></span>

            </div>

            <div>
                <label for="faixa-etaria" class="form-label">Faixa-etária</label>
                <input type="text" th:field="*{faixaEtaria}" class="form-control" id="faixa-etaria" name="faixa-etaria">

                <span class="erro-faixa-etaria"
                      style="display:flex; font-size:15px; margin-bottom: 10px;"></span>


            </div>

            <div>
                <label for="lancamento" class="form-label">Lançamento</label>
                <input type="date" th:field="*{lancamento}" class="form-control" id="lancamento" name="lancamento">

                <span class="erro-lancamento"
                      style="display:flex; font-size:15px; margin-bottom: 10px;"></span>

            </div>

            <div>
                <label for="duracao" class="form-label">Duração (em minutos)</label>
                <input type="number" th:field="*{duracaoEmMin}" class="form-control" id="duracao" name="duracao" min="1" placeholder="Ex: 120">

                <span class="erro-duracao"
                      style="display:flex; font-size:15px; margin-bottom: 10px;"></span>

            </div>

            <div class="row g-3">
                <div class="col-md-6">
                    <label for="precoAluguel" class="form-label">
                        Preço do aluguel
                    </label>

                    <div class="input-group">
                        <span class="input-group-text">R$</span>

                        <input type="number"
                               class="form-control"
                               id="precoAluguel"
                               th:field="*{precoAluguel}"
                               placeholder="0.00"
                               min="0"
                               step="0.01"
                               required>

                        <small class="text-danger"
                               th:if="${#fields.hasErrors('precoAluguel')}"
                               th:errors="*{precoAluguel}">
                        </small>
                    </div>
                </div>

                <div class="col-md-6">
                    <label for="precoCompra" class="form-label">
                        Preço de compra
                    </label>

                    <div class="input-group">
                        <span class="input-group-text">R$</span>

                        <input type="number"
                               class="form-control"
                               id="precoCompra"
                               th:field="*{precoCompra}"
                               placeholder="0.00"
                               min="0"
                               step="0.01"
                               required>
                        
                        <small class="text-danger"
                               th:if="${#fields.hasErrors('precoCompra')}"
                               th:errors="*{precoCompra}">
                        </small>
                    </div>
                </div>
            </div>

            <button type="submit" class="btn-cadastrar">
                Adicionar filme
            </button>

        </form>

        <script th:src="@{/JS/addFilme.js}"></script>
    </body>

</html>
