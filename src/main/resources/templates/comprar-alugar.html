<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link
            href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Bebas+Neue&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Limelight&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Noticia+Text:ital,wght@0,400;0,700;1,400;1,700&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
            rel="stylesheet">

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
              integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

        <link rel="stylesheet" th:href="@{/CSS/reset.css}">
        <link rel="stylesheet" th:href="@{/CSS/home.css}">
        <link rel="stylesheet" th:href="@{/CSS/comprar-alugar.css}">

        <title>Comprar ou Alugar</title>
    </head>

    <body>

        <h2>COMPRAR / ALUGAR</h2>

        <section>
            <div class="form-pagar">
                <h3>Selecione a opção desejada:</h3>

                <form id="form-pagamento"
                      class="form-pagamento"
                      th:action="@{/pagar}"
                      method="post">

                    <input type="hidden" id="tipo-operacao" name="tipoOperacao">

                    <div class="comprar-alugar">
                        <button type="button" id="btn-comprar" class="btn comprar btn-lg">
                            <img src="../ICON/icon-shopping-cart.svg" alt="comprar">
                            COMPRAR
                        </button>

                        <button type="button" id="btn-alugar" class="btn alugar btn-lg">
                            <img src="../ICON/icon-calendar.svg" alt="alugar">
                            ALUGAR
                        </button>
                    </div>

                    <div class="opcao-escolha">
                        <div class="escolher-filme">
                            <select class="form-select" name="filmeId" required>
                                <option value="" selected disabled>
                                    Selecione um filme
                                </option>

                                <option th:each="filme : ${filmes}"
                                        th:value="${filme.id}"
                                        th:text="${filme.titulo}">
                                </option>
                            </select>
                        </div>

                        <div class="escolher-pagamento">
                            <select class="form-select" name="tipoPagamentoId" required>
                                <option value="" selected disabled>
                                    Forma de pagamento
                                </option>

                                <option value="1">PIX</option>
                                <option value="2">Crédito</option>
                                <option value="3">Débito</option>
                            </select>
                        </div>
                    </div>

                    <div class="data-aluguel">
                        <label for="data-compra">
                            Data do aluguel
                            <input type="date"
                                   id="data-compra"
                                   name="dataInicio"
                                   required>
                        </label>

                        <label for="data-devolucao" id="campo-devolucao">
                            Devolução
                            <input type="date"
                                   id="data-devolucao"
                                   name="dataDevolucao"
                                   required>
                        </label>
                    </div>

                    <button type="submit" class="btn-pagar">
                        PAGAR
                    </button>
                </form>
            </div>
        </section>

        <script th:src="@{/JS/comprar-alugar.js}"></script>
    </body>

</html>
