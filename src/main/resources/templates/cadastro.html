<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Bebas+Neue&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Limelight&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Noticia+Text:ital,wght@0,400;0,700;1,400;1,700&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
        
    <link rel="stylesheet" th:href="@{/CSS/reset.css}">
    <link rel="stylesheet" th:href="@{/CSS/cadastro.css}">

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery-validate/1.22.1/jquery.validate.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery-validate/1.22.1/localization/messages_pt_BR.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery.mask/1.14.16/jquery.mask.min.js"></script>

    <title>Cadastro</title>
</head>

<body>
    <header>
        <h1>CINEMIX</h1>
    </header>
    <form class="row g-3 formulario-cadastro" action="#" th:action="@{/cadastro}" th:object="${user}" method="post">
        <div class="col-md-6">
            <label for="nome" class="form-label">Nome</label>
            <input type="text" th:field="*{nome}" placeholder="digite seu Nome..." class="form-control" id="nome" name="nome">

             <span class="erro-nome"
            style="display:flex; font-size:15px; margin-bottom: 10px;"></span>
        </div>
        <div class="col-md-6">
            <label for="inputEmail4" class="form-label">Email</label>
            <input type="email" th:field="*{email}" placeholder="digite seu email..." class="form-control" id="inputEmail4" name="email">

             <span class="erro-email"
            style="display:flex; font-size:15px; margin-bottom: 10px;"></span>
        </div>
        <div class="col-md-6">
            <label for="inputPassword4" class="form-label">Senha</label>
            <input type="password" th:field="*{senha}" placeholder="●●●●●●●●●" class="form-control" id="inputPassword4" name="senha">

            <span class="erro-senha"
            style="display:flex; font-size:15px; margin-bottom: 10px;"></span>
        </div>
        <div class="col-12">
            <label for="inputTel" class="form-label">Número</label>
            <input type="tel" th:field="*{telefone}" class="form-control" id="inputTel" placeholder="(00) 00000-0000" name="numero">

            <span class="erro-numero"
            style="display:flex; font-size:15px; margin-bottom: 10px;"></span>
        </div>
        <div class="col-md-6">
            <label for="inputCity" class="form-label">Cidade</label>
            <input type="text" th:field="*{cidade}" class="form-control" id="inputCity" name="cidade">
            
            <span class="erro-cidade"
            style="display:flex; font-size:15px; margin-bottom: 10px;"></span>
        </div>
        <div class="col-12 botao-cadastro">
            <button type="submit" class="btn-primary">CADASTRAR</button>
        </div>
    </form>

    <script th:src="@{/JS/cadastro.js}"></script>
</body>

</html>
