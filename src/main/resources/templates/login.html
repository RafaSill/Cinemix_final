<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Bebas+Neue&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Limelight&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Noticia+Text:ital,wght@0,400;0,700;1,400;1,700&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <link rel="stylesheet" th:href="@{/CSS/reset.css}">
    <link rel="stylesheet" th:href="@{/CSS/login.css}">

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery-validate/1.22.1/jquery.validate.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery-validate/1.22.1/localization/messages_pt_BR.min.js"></script>

    <title>Login</title>
</head>

<body>

    <header>
        <h1>CINEMIX</h1>
    </header>

    <div class="formulario-login">

        <div class="boas-vindas">
            <h4>Bem-Vindo de volta!</h4>
            <p>Faça login para continuar</p>
        </div>

        <form id="form-login" action="#" th:action="@{/login}" th:object="${user}" method="POST">
            <div class="mb-3">
                <label for="exampleInputEmail1" class="form-label">Email</label>
                <input type="email" th:field="*{email}" placeholder="Digite seu email..." class="form-control" id="exampleInputEmail1" name="email"
                    aria-describedby="emailHelp">
            </div>

            <span 
            class="erro-email" 
            style="display:flex; font-size:11px; color:#c9444d; margin-left:85px; margin-bottom: 10px;"></span>

            <div class="mb-3">
                <label for="exampleInputPassword1" class="form-label">Senha</label>
                <input type="password" th:field="*{senha}" placeholder="●●●●●●●●" class="form-control" id="exampleInputPassword1" name="senha">
            </div>

            <span class="erro-senha"
            style="display:flex; font-size:11px; color:#c9444d; margin-left:85px; margin-bottom: 10px;"></span>
            
            <p th:if="${erro}" th:text="${erro}"></p>
            <button type="submit" class="btn-entrar">ENTRAR</button>
        </form>

        <div class="fazer-cadastro">
            <p>Não tem uma conta?
                <a th:href="@{/cadastro}">Cadastre-se</a>
            </p>
        </div>
    </div>

    <script th:src="@{/JS/login.js}"></script>
</body>

</html>
